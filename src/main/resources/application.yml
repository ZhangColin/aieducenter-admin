server:
  port: 8081

spring:
  application:
    name: aieducenter-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    table: admin_flyway_schema_history
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

cartisan:
  openapi:
    self:
      api-key: admin-console
      api-secret: ${ADMIN_API_SECRET:}
    apikey-service-url: ${APIKEY_SERVICE_URL:}
  security:
    interceptor:
      path-patterns:
        - "/api/admin/**"
      exclude-path-patterns:
        - "/error"
        - "/actuator/**"
        - "/api/admin/auth/login"
        - "/swagger-ui/**"
        - "/api-docs/**"

sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  token-prefix: Bearer

admin:
  app-registry:
    base-url: ${APP_REGISTRY_URL:http://localhost:8088}
  # payment 能力域地址（联调前默认值占位，真实部署经 PAYMENT_SERVICE_URL 覆盖）
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8082}
  # identity 能力域地址（联调前默认值占位，真实部署经 IDENTITY_SERVICE_URL 覆盖）
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:10001}

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
